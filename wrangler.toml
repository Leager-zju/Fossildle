# 每日排行后端（Cloudflare Workers + D1）。部署步骤见 readme「每日排行」一节。
# 放在仓库根目录，所有 wrangler 命令（deploy / secret / d1 …）无需额外参数即可运行。
name = "fossildle-rank"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# 允许访问的来源：逗号分隔的精确域名，或写 "*" 放行任意来源。
# 本服务只靠 Authorization 头鉴权、不使用 cookie，所以 "*" 不会被别的站点冒用身份；
# 想收紧就把下面改成你的正式域名（例如 "https://leager-zju.github.io"）。
[vars]
ALLOWED_ORIGIN = "*"

# 每天 UTC 00:10 清理超出保留期的历史数据（按天分桶，本身不需要“重置”任务）。
[triggers]
crons = ["10 0 * * *"]

[observability]
enabled = true

# 对外地址：自定义域名，避开大陆对 *.workers.dev 的阻断。
# 前提是 fossildle.xyz 已加入本 Cloudflare 账号且 NS 已生效，否则 deploy 会报找不到 zone（旧版本不受影响）。
[[routes]]
pattern = "rank.fossildle.xyz"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "fossildle-rank"
# 用 `npx wrangler d1 create fossildle-rank` 生成的 ID 替换下面这行占位值。
database_id = "a45e084c-9513-427b-9ae8-881c0c3b34a6"
migrations_dir = "worker/migrations"
